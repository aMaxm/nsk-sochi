<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#060912">
  <title>Админка — Новосибирск — Сочи пешком</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 18px 12px 40px;
      min-height: 100vh;
      background: linear-gradient(135deg, #060912, #0f172a);
      color: #f8fafc;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 28px; line-height: 1.1; margin: 8px 0; }
    p { color: #cbd5e1; line-height: 1.5; }
    .card {
      margin-top: 14px;
      padding: 16px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px;
      background: rgba(255,255,255,.045);
    }
    label {
      display: block;
      margin: 14px 0 6px;
      font-size: 13px;
      font-weight: 800;
    }
    input {
      width: 100%;
      min-height: 48px;
      padding: 12px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 12px;
      background: #0b1220;
      color: #fff;
      font: inherit;
      font-size: 16px;
    }
    button, .link {
      display: flex;
      width: 100%;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
      padding: 12px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 12px;
      background: rgba(255,255,255,.08);
      color: #fff;
      font: inherit;
      font-weight: 800;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    button.primary {
      border: 0;
      background: linear-gradient(135deg, #8b5cf6, #38bdf8);
    }
    .day {
      padding: 12px;
      border-radius: 12px;
      background: rgba(139,92,246,.14);
      color: #ddd6fe;
      font-weight: 900;
    }
    #status { overflow-wrap: anywhere; }
    .small { color: #94a3b8; font-size: 12px; }
  </style>
</head>
<body>
<main>
  <h1>Управление путешествием</h1>
  <p>Новосибирск — Сочи пешком. Здесь можно обновить данные, не редактируя код сайта.</p>

  <section class="card">
    <div class="day" id="day">Загружаю номер дня…</div>

    <label for="password">Пароль админки</label>
    <input id="password" type="password" autocomplete="current-password"
      placeholder="Пароль, заданный в Cloudflare">

    <button id="load" type="button">Загрузить текущие данные</button>

    <label for="title">Заголовок дня</label>
    <input id="title" maxlength="180"
      placeholder="Например: Дорога к Сатке">

    <label for="place">Место</label>
    <input id="place" maxlength="120"
      placeholder="Например: Сатка">

    <label for="coords">Координаты (широта, долгота)</label>
    <input id="coords" inputmode="decimal"
      placeholder="54.918786, 58.902582">

    <button id="gps" type="button">📍 Определить координаты по GPS</button>
    <button id="save" class="primary" type="button">Сохранить изменения</button>

    <p id="status" role="status">Сначала загрузи текущие данные.</p>
    <p class="small">
      Для GPS разреши браузеру доступ к геолокации. Координаты определяются
      устройством и могут иметь погрешность.
    </p>
  </section>

  <a class="link" href="../" target="_blank" rel="noopener">
    Открыть сайт путешествия
  </a>
</main>

<script>
const API_URL = "https://nsk-sochi.amaxmdev.workers.dev".replace(/\/+$/, "");

const $ = id => document.getElementById(id);
const status = message => $("status").textContent = message;

function checkApiUrl() {
  if (!API_URL.startsWith("https://") || API_URL.includes("ВСТАВЬ_URL")) {
    status("Сначала вставь URL своего Cloudflare Worker в код этого файла.");
    return false;
  }
  return true;
}

async function loadConfig() {
  if (!checkApiUrl()) return;

  status("Загружаю данные из GitHub…");

  try {
    const response = await fetch(API_URL + "/config", {
      method: "GET",
      cache: "no-store"
    });

    const data = await response.json();

    if (!response.ok) throw new Error(data.error || "Не удалось загрузить данные");

    $("title").value = data.title || "";
    $("place").value = data.place || "";
    $("coords").value = data.coords || "";
    $("day").textContent = "Сегодня — день " + data.day + " путешествия";
    status("Данные загружены. После изменений нажми «Сохранить изменения».");
  } catch (error) {
    status("Ошибка загрузки: " + error.message);
  }
}

$("load").addEventListener("click", loadConfig);

$("gps").addEventListener("click", () => {
  if (!navigator.geolocation) {
    status("Этот браузер не поддерживает геолокацию.");
    return;
  }

  status("Определяю местоположение…");

  navigator.geolocation.getCurrentPosition(
    position => {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      $("coords").value = lat.toFixed(6) + ", " + lng.toFixed(6);
      status("Координаты получены. Нажми «Сохранить изменения», чтобы записать их.");
    },
    error => {
      const messages = {
        1: "Доступ к геолокации запрещён. Разреши его в браузере.",
        2: "Местоположение пока не удалось определить.",
        3: "Определение местоположения заняло слишком много времени."
      };
      status(messages[error.code] || "Ошибка геолокации.");
    },
    { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
  );
});

$("save").addEventListener("click", async () => {
  if (!checkApiUrl()) return;

  const password = $("password").value;
  if (!password) {
    status("Введи пароль админки.");
    return;
  }

  const data = {
    title: $("title").value.trim(),
    place: $("place").value.trim(),
    coords: $("coords").value.trim()
  };

  if (!data.title || !data.place || !data.coords) {
    status("Заполни заголовок, место и координаты.");
    return;
  }

  $("save").disabled = true;
  status("Сохраняю изменения в GitHub…");

  try {
    const response = await fetch(API_URL + "/config", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + password
      },
      body: JSON.stringify(data)
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error || "Не удалось сохранить изменения");
    }

    $("day").textContent = "Сегодня — день " + result.day + " путешествия";
    status("Готово! Изменения сохранены в GitHub. Сайт обновится после публикации.");
  } catch (error) {
    status("Ошибка сохранения: " + error.message);
  } finally {
    $("save").disabled = false;
  }
});

loadConfig();
</script>
</body>
</html>
