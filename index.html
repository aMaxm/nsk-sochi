<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#060912" />
  <title>Иду пешком из Новосибирска в Сочи</title>
  <meta name="description" content="Пешее путешествие из Новосибирска в Сочи." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    :root{
      --bg:#060912;
      --bg2:#0f172a;
      --line:rgba(255,255,255,.10);
      --text:#f8fafc;
      --muted:#cbd5e1;
      --soft:#94a3b8;
      --accent:#8b5cf6;
      --accent2:#22c55e;
      --accent3:#38bdf8;
      --shadow:0 24px 80px rgba(0,0,0,.45);
    }

    *{box-sizing:border-box}

    html{
      scroll-behavior:smooth;
      scroll-padding-top:24px;
    }

    body{
      margin:0;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 10% 10%, rgba(139,92,246,.25), transparent 18%),
        radial-gradient(circle at 90% 12%, rgba(56,189,248,.14), transparent 16%),
        radial-gradient(circle at 50% 100%, rgba(34,197,94,.12), transparent 20%),
        linear-gradient(135deg,var(--bg),var(--bg2));
      min-height:100vh;
      padding:16px 16px 92px;
      overflow-x:hidden;
    }

    .shell{
      width:min(1040px,100%);
      margin:0 auto;
    }

    .hero{
      position:relative;
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:28px;
      background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));
      box-shadow:var(--shadow);
    }

    .inner{padding:16px}

    h1{
      margin:0;
      padding:8px 4px 20px;
      text-align:center;
      font-size:clamp(26px,5vw,52px);
      line-height:1.05;
      letter-spacing:-.05em;
    }

    .mapCard{
      padding:12px;
      border-radius:18px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.04);
      display:grid;
      gap:10px;
      scroll-margin-top:24px;
    }

    .mapHead{
      display:flex;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    }

    .mapTitle{font-weight:800}
    .mapSub{color:var(--soft);font-size:12px}

    .mapFrame{
      width:100%;
      min-height:260px;
      height:clamp(260px,38vw,380px);
      border-radius:14px;
      overflow:hidden;
      transform:translateZ(0);
    }

    .socialBlock{
      margin-top:14px;
      padding:14px;
      border-radius:18px;
      border:1px solid var(--line);
      background:rgba(0,0,0,.14);
      scroll-margin-top:24px;
    }

    .sectionTitle{
      margin:0 0 12px;
      font-size:18px;
    }

    .socials{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    @media (max-width:560px){
      .socials{grid-template-columns:1fr}
    }

    a.social,
    button.copy,
    .donatButton,
    .sticky a{
      appearance:none;
      cursor:pointer;
      text-decoration:none;
      color:var(--text);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      min-height:46px;
      padding:0 14px;
      border-radius:14px;
      background:rgba(255,255,255,.08);
      border:1px solid var(--line);
      font:inherit;
      font-weight:800;
      transition:background .16s ease,transform .16s ease;
    }

    a.social:hover,
    button.copy:hover,
    .donatButton:hover,
    .sticky a:hover{
      transform:translateY(-1px);
      background:rgba(255,255,255,.12);
    }

    a.social{
      min-height:60px;
      justify-content:space-between;
      padding:14px;
      border-radius:18px;
    }

    .social .name{font-weight:900}
    .social .desc{
      color:var(--soft);
      font-size:12px;
      margin-top:2px;
      font-weight:500;
    }

    .social .arrow{
      color:#c4b5fd;
      font-size:18px;
    }

    .supportBlock{
      margin-top:14px;
      padding:14px;
      border-radius:18px;
      border:1px solid rgba(34,197,94,.22);
      background:linear-gradient(180deg,rgba(34,197,94,.10),rgba(255,255,255,.04));
      display:grid;
      gap:10px;
      scroll-margin-top:24px;
    }

    .supportTitle{
      margin:0;
      font-size:18px;
    }

    .supportHint{
      color:var(--soft);
      font-size:12px;
    }

    .phone{
      font-size:clamp(22px,3.5vw,28px);
      font-weight:900;
      letter-spacing:.2px;
      line-height:1.1;
      word-break:break-word;
    }

    .bank{
      color:var(--muted);
    }

    .copyFull{
      width:100%;
    }

    .donatButton{
      width:100%;
      min-height:52px;
      background:linear-gradient(135deg,var(--accent),var(--accent3));
      border-color:transparent;
    }

    .sticky{
      position:fixed;
      left:0;
      right:0;
      bottom:12px;
      width:min(1040px,calc(100% - 24px));
      margin:0 auto;
      display:flex;
      gap:10px;
      padding:10px;
      border-radius:20px;
      background:rgba(7,11,20,.80);
      border:1px solid var(--line);
      backdrop-filter:blur(14px);
      box-shadow:0 10px 35px rgba(0,0,0,.32);
      z-index:20;
      justify-content:center;
      transition:transform .22s ease,opacity .22s ease;
    }

    .sticky.is-hidden{
      transform:translateY(calc(100% + 24px));
      opacity:0;
      pointer-events:none;
    }

    .sticky a{
      flex:1 1 0;
      min-width:0;
      min-height:46px;
      border-radius:14px;
      font-weight:900;
    }

    .sticky .primary{
      background:linear-gradient(135deg,var(--accent),var(--accent3));
      border-color:transparent;
    }

    .sticky .donat{
      background:rgba(255,255,255,.06);
    }

    @media (prefers-reduced-motion:reduce){
      *{
        animation:none!important;
        transition:none!important;
        scroll-behavior:auto!important;
      }
    }
  </style>
</head>

<body>
  <main class="shell">
    <section class="hero">
      <div class="inner">

        <h1>Иду пешком из Новосибирска в Сочи</h1>

        <div class="mapCard" id="mapBlock">
          <div class="mapHead">
            <div class="mapTitle">Карта пути</div>
            <div class="mapSub" id="mapSub"></div>
          </div>

          <div id="map" class="mapFrame"></div>
        </div>

        <section class="socialBlock" id="socialBlock">
          <h2 class="sectionTitle">Мои социальные сети</h2>

          <div class="socials">
            <a class="social" id="tg" href="#" target="_blank" rel="noopener noreferrer">
              <div>
                <div class="name">Telegram</div>
                <div class="desc">Канал и связь</div>
              </div>
              <div class="arrow">↗</div>
            </a>

            <a class="social" id="ig" href="#" target="_blank" rel="noopener noreferrer">
              <div>
                <div class="name">Инстаграм</div>
                <div class="desc">Сторис и фото</div>
              </div>
              <div class="arrow">↗</div>
            </a>

            <a class="social" id="max" href="#" target="_blank" rel="noopener noreferrer">
              <div>
                <div class="name">Max</div>
                <div class="desc">Новости</div>
              </div>
              <div class="arrow">↗</div>
            </a>

            <a class="social" id="yt" href="#" target="_blank" rel="noopener noreferrer">
              <div>
                <div class="name">YouTube</div>
                <div class="desc">Видео</div>
              </div>
              <div class="arrow">↗</div>
            </a>

            <a class="social" id="vk" href="#" target="_blank" rel="noopener noreferrer">
              <div>
                <div class="name">Вконтакте</div>
                <div class="desc">Сообщество</div>
              </div>
              <div class="arrow">↗</div>
            </a>
          </div>
        </section>

        <section class="supportBlock" id="supportBlock">
          <h2 class="supportTitle">Поддержать путешествие</h2>
          <div class="supportHint">Перевод можно сделать по номеру телефона</div>

          <div class="phone" id="phone"></div>
          <div class="bank" id="bank"></div>

          <button class="copy copyFull" id="copyBtn" type="button">
            Скопировать номер
          </button>

          <a
            class="donatButton"
            href="https://pay.cloudtips.ru/p/6ee28d2f"
            target="_blank"
            rel="noopener noreferrer"
          >
            Донат через сайт
          </a>
        </section>

      </div>
    </section>
  </main>

  <div class="sticky" id="stickyPanel">
    <a class="primary" href="#socialBlock">Соцсети</a>
    <a class="donat" href="#supportBlock">Донат</a>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const data = {
      phone: '+7 903 999-37-78',
      tel: '+79039993778',
      bank: 'Тинькофф или Альфа-Банк',

      currentCoords: '56.633957, 66.310294',
      currentPlace: 'текущая точка маршрута',
      mapZoom: 9,
      mapUrlLabel: 'Сейчас я',

      instagram: 'https://www.instagram.com/max_with.axe?igsh=bzR3ZjUxeHVjM3o2',
      max: 'https://max.ru/channel_kotovput',
      youtube: 'https://youtube.com/@kotikilapkami?si=5LbQ4_q9oEJFHt6m',
      vk: 'https://vk.ru/club239438129',
      telegram: 'https://t.me/kotikilapkami'
    };

    const setText = (id, value) => {
      const element = document.getElementById(id);
      if (element) element.textContent = value;
    };

    function parseCoords(input){
      const parts = String(input)
        .split(',')
        .map(item => item.trim())
        .filter(Boolean);

      if (parts.length !== 2) return null;

      const lat = Number(parts[0]);
      const lng = Number(parts[1]);

      if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
        return null;
      }

      if (lat < -90 || lat > 90 || lng < -180 || lng > 180) {
        return null;
      }

      return {lat, lng};
    }

    const coords = parseCoords(data.currentCoords) || {
      lat:56.633957,
      lng:66.310294
    };

    setText('phone', data.phone);
    setText('bank', data.bank);

    setText(
      'mapSub',
      `${data.mapUrlLabel}: ${data.currentPlace} · ${coords.lat.toFixed(5)}, ${coords.lng.toFixed(5)}`
    );

    document.getElementById('ig').href = data.instagram;
    document.getElementById('max').href = data.max;
    document.getElementById('yt').href = data.youtube;
    document.getElementById('vk').href = data.vk;
    document.getElementById('tg').href = data.telegram;

    const map = L.map('map', {
      scrollWheelZoom:false,
      doubleClickZoom:false,
      zoomControl:true,
      attributionControl:false,
      tap:false,
      touchZoom:true,
      boxZoom:false,
      keyboard:true,
      dragging:true,
      zoomAnimation:false,
      markerZoomAnimation:false,
      inertia:true,
      worldCopyJump:false,
      closePopupOnClick:false,
      trackResize:false
    }).setView([coords.lat, coords.lng], data.mapZoom);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom:19,
      crossOrigin:true
    }).addTo(map);

    const marker = L.marker([coords.lat, coords.lng])
      .addTo(map)
      .bindPopup(data.currentPlace);

    marker.openPopup();

    function resizeMap(){
      requestAnimationFrame(() => map.invalidateSize());
    }

    resizeMap();

    window.addEventListener('resize', resizeMap, {
      passive:true
    });

    function setMapPoint(coordsString, place){
      const newCoords = parseCoords(coordsString);

      if (!newCoords) return false;

      data.currentCoords = coordsString;
      data.currentPlace = place;

      marker.setLatLng([newCoords.lat, newCoords.lng]);
      marker.setPopupContent(place);

      map.setView(
        [newCoords.lat, newCoords.lng],
        data.mapZoom,
        {animate:false}
      );

      setText(
        'mapSub',
        `${data.mapUrlLabel}: ${place} · ${newCoords.lat.toFixed(5)}, ${newCoords.lng.toFixed(5)}`
      );

      setTimeout(resizeMap, 50);

      return true;
    }

    window.setMapPoint = setMapPoint;

    window.setMapPointFromString = (coordsString, place) => {
      return setMapPoint(coordsString, place);
    };

    async function copyPhone(){
      const text = data.tel;
      const button = document.getElementById('copyBtn');
      const oldText = button.textContent;

      try{
        if (navigator.clipboard && window.isSecureContext){
          await navigator.clipboard.writeText(text);
        } else {
          const input = document.createElement('input');

          input.value = text;
          input.style.position = 'fixed';
          input.style.opacity = '0';

          document.body.appendChild(input);
          input.focus();
          input.select();
          document.execCommand('copy');
          input.remove();
        }

        button.textContent = 'Скопировано';

        setTimeout(() => {
          button.textContent = oldText;
        }, 1400);
      } catch(error){
        button.textContent = 'Не удалось скопировать';

        setTimeout(() => {
          button.textContent = oldText;
        }, 1600);
      }
    }

    document
      .getElementById('copyBtn')
      .addEventListener('click', copyPhone);

    const sticky = document.getElementById('stickyPanel');

    let lastScrollY = window.scrollY;
    let ticking = false;
    let hidden = false;

    function updateStickyVisibility(){
      const currentScrollY = window.scrollY;
      const delta = currentScrollY - lastScrollY;

      if (currentScrollY < 80){
        sticky.classList.remove('is-hidden');
        hidden = false;
      } else if (delta > 6 && !hidden){
        sticky.classList.add('is-hidden');
        hidden = true;
      } else if (delta < -6 && hidden){
        sticky.classList.remove('is-hidden');
        hidden = false;
      }

      lastScrollY = currentScrollY;
      ticking = false;
    }

    window.addEventListener('scroll', () => {
      if (!ticking){
        window.requestAnimationFrame(updateStickyVisibility);
        ticking = true;
      }
    }, {
      passive:true
    });

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      document.documentElement.style.scrollBehavior = 'auto';
    }
  </script>
</body>
</html>
